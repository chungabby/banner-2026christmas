<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>It's Saturday — 客製化聖誕樹香氛蠟燭</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      /* ══════════ 顏色 ══════════ */
      --bg: #d9d3cc;               /* 圖片載入前的底色 */
      --text: #ffffff;             /* 文字顏色 */

      /* ══════════ 版面 ══════════ */
      --height-pc: 600px;          /* 電腦版高度 */
      --height-tab: 740px;         /* 平板版高度 */
      --ratio-m: 800 / 1100;       /* 手機版比例 */
      --focus-m: center;           /* 手機圖片裁切重心 */
      --focus-pc: center;          /* 電腦／平板圖片裁切重心 */

      /* ══════════ 電腦版文字 ══════════ */
      --pc-scale-top: 1.2;        /* 上段文字放大倍數（1.2 = 放大 20%） */
      --pc-scale-bottom: 1;     /* 下段文字放大倍數 */
      --pc-x: 50%;                /* 文字水平位置（50% = 置中） */

      /* ══════════ 輪播 ══════════ */
      --fade: 1.2s;                /* 淡入淡出時間（停留秒數在最下方 script） */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; background: var(--bg); overflow-x: hidden; -webkit-font-smoothing: antialiased; }

    /* ===== 外框 ===== */
    .banner { position: relative; aspect-ratio: var(--ratio-m); width: 100%; background: var(--bg); overflow: hidden; }
    .banner img {
      position: absolute; inset: 0; display: block; width: 100%; height: 100%;
      object-fit: cover; object-position: var(--focus-m); color: transparent; background: var(--bg);
    }

    /* ===== 底圖（多張時輪流淡入） ===== */
    .slide { position: absolute; inset: 0; opacity: 0; transition: opacity var(--fade) ease; }
    .slide.is-active { opacity: 1; }

    /* ===== 文字：依設計稿等比例縮放 ===== */
    .copy-area { position: absolute; inset: 0; z-index: 1; container-type: size; }
    .copy {
      --u: calc(100cqw / 800);      /* 手機：設計稿寬 800px */
      --ut: var(--u);                /* 上段 */
      --ub: var(--u);                /* 下段 */
      position: absolute; inset: 0; color: var(--text); text-align: center;
    }
    .group { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
    .line { line-height: 1; white-space: nowrap; }

    /* ── 上段：第一行距離頂端 70px，往下一行接一行 ── */
    .group-top { top: calc(70 * var(--ut)); }
    /* 今年聖誕樹，由你親自設計 */
    .l1 {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: calc(26 * var(--ut));
      font-weight: 300;
      letter-spacing: 0.15em; padding-left: 0.15em;   /* 抵銷字距讓置中更準 */
    }
    /* 客製工藝 */
    .l2 {
      margin-top: calc(60 * var(--ut));   /* 和上一行的間距 */
      font-family: 'Noto Serif TC', serif;
      font-size: calc(55 * var(--ut));
      font-weight: 400;
      letter-spacing: 0em;
    }
    /* 聖誕樹香氛蠟燭 */
    .l3 {
      margin-top: calc(20 * var(--ut));   /* 和上一行的間距 */
      font-family: 'Noto Serif TC', serif;
      font-size: calc(55 * var(--ut));
      font-weight: 400;
      letter-spacing: 0em;
    }
    /* 自由選色、搭配香氣 */
    .l4 {
      margin-top: calc(30 * var(--ut));   /* 和上一行的間距 */
      font-family: 'Noto Sans TC', sans-serif;
      font-size: calc(24 * var(--ut));
      font-weight: 500;
      letter-spacing: 0.2em; padding-left: 0.2em;   /* 抵銷字距讓置中更準 */
    }
    /* 堆疊一棵專屬香氛禮物 */
    .l5 {
      margin-top: calc(15 * var(--ut));   /* 和上一行的間距 */
      font-family: 'Noto Sans TC', sans-serif;
      font-size: calc(24 * var(--ut));
      font-weight: 500;
      letter-spacing: 0.2em; padding-left: 0.2em;   /* 抵銷字距讓置中更準 */
    }

    /* ── 下段：最後一行距離底端 70px，往上一行接一行 ── */
    .group-bottom { bottom: calc(70 * var(--ub)); }
    /* 11.21 SAT · 21:00 */
    .l6 {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: calc(36 * var(--ub));
      font-weight: 500;
      letter-spacing: 0.02em; padding-left: 0.02em;   /* 抵銷字距讓置中更準 */
    }
    /* 開放預購 */
    .l7 {
      margin-top: calc(18 * var(--ub));   /* 和上一行的間距 */
      font-family: 'Noto Sans TC', sans-serif;
      font-size: calc(34 * var(--ub));
      font-weight: 700;
      letter-spacing: 0.12em; padding-left: 0.12em;   /* 抵銷字距讓置中更準 */
    }

    /* ===== 平板＋電腦（768px 以上）：依高度縮放 ===== */
    @media (min-width: 768px) {
      .banner img { object-position: var(--focus-pc); }
      .copy {
        --u: calc(100cqh / 1100);
        --ut: calc(var(--u) * var(--pc-scale-top));
        --ub: calc(var(--u) * var(--pc-scale-bottom));
      }
      .group { left: var(--pc-x); right: auto; transform: translateX(-50%); }
    }
    @media (min-width: 768px) and (max-width: 1023px) { .banner { aspect-ratio: auto; height: var(--height-tab); } }
    @media (min-width: 1024px) { .banner { aspect-ratio: auto; height: var(--height-pc); } }

    /* ===== 整張可點擊 ===== */
    .banner-link { position: absolute; inset: 0; z-index: 2; display: block; }
  </style>
</head>
<body>
  <div class="banner">

    <!-- ══════════ 底圖 ══════════
         source = 手機版、img = 電腦／平板；第 1 張要有 is-active -->

    <!-- 第 1 張 -->
    <picture class="slide is-active">
      <source media="(max-width: 767px)" srcset="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-m-01.jpg">
      <img src="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-01.jpg" alt="客製化聖誕樹香氛蠟燭">
    </picture>

    <!-- 第 2 張 -->
    <picture class="slide">
      <source media="(max-width: 767px)" srcset="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-m-02.jpg">
      <img src="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-02.jpg" alt="客製化聖誕樹香氛蠟燭">
    </picture>

    <!-- 第 3 張 -->
    <picture class="slide">
      <source media="(max-width: 767px)" srcset="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-m-03.jpg">
      <img src="https://ik.imagekit.io/itssaturday/banner/20261113-christmas/20261113-03.jpg" alt="客製化聖誕樹香氛蠟燭">
    </picture>

    <div class="copy-area">
      <div class="copy">
        <div class="group group-top">
          <p class="line l1">今年聖誕樹，由你親自設計</p>
          <p class="line l2">客製工藝</p>
          <p class="line l3">聖誕樹香氛蠟燭</p>
          <p class="line l4">自由選色、搭配香氣</p>
          <p class="line l5">堆疊一棵專屬香氛禮物</p>
        </div>
        <div class="group group-bottom">
          <p class="line l6">11.21 SAT · 21:00</p>
          <p class="line l7">開放預購</p>
        </div>
      </div>
    </div>

    <a class="banner-link" href="https://its-saturday.com/page/doing-nothing" target="_top" aria-label="客製化聖誕樹香氛蠟燭"></a>

  </div>

  <script>
    /* ===== 輪播 ===== */
    (function () {
      var INTERVAL = 4000;   /* 每張停留時間（毫秒） */
      var slides = document.querySelectorAll(".slide");
      if (slides.length < 2) return;
      var current = 0, timer = null;

      /* 圖片載好才切換，避免看到空白 */
      function isReady(slide) {
        var img = slide.querySelector("img");
        return img && img.complete && img.naturalWidth > 0;
      }
      function next() {
        for (var step = 1; step < slides.length; step++) {
          var n = (current + step) % slides.length;
          if (isReady(slides[n])) {
            slides[current].classList.remove("is-active");
            slides[n].classList.add("is-active");
            current = n;
            schedule(INTERVAL);
            return;
          }
        }
        schedule(1000);
      }
      function schedule(ms) { clearTimeout(timer); timer = setTimeout(next, ms); }

      /* 切到別的分頁時暫停 */
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) clearTimeout(timer); else schedule(INTERVAL);
      });
      schedule(INTERVAL);
    })();

    /* ===== 回報高度給 BVShop 頁面 ===== */
    (function () {
      var ID = "isp-bnr-20261113-christmas";   /* 要和嵌入碼裡的代號一樣 */
      var banner = document.querySelector(".banner");
      var last = 0;
      function report(force) {
        var h = Math.ceil(banner.getBoundingClientRect().height);
        if (h && (force === true || h !== last)) {
          last = h;
          window.parent.postMessage({ ispBannerHeight: h, ispBannerId: ID }, "*");
        }
      }
      function forceReport() { report(true); }
      window.addEventListener("load", forceReport);
      window.addEventListener("resize", function () { report(false); });
      if (window.ResizeObserver) new ResizeObserver(function () { report(false); }).observe(banner);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(forceReport);
      report(true);
      setTimeout(forceReport, 500);
      setTimeout(forceReport, 1500);
      setTimeout(forceReport, 3000);
    })();
  </script>
</body>
</html>
